<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Twofold app icon">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F3"/>
      <stop offset="1" stop-color="#EFEADD"/>
    </linearGradient>
    <clipPath id="left-sheet"><rect x="232" y="352" width="368" height="368" rx="104"/></clipPath>
  </defs>
  <!-- macOS icon grid: an 824px rounded square centred on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)"/>
  <rect x="100.500" y="100.500" width="823" height="823" rx="185.500" fill="none" stroke="#1F2430" stroke-opacity="0.08"/>
  <rect x="232" y="352" width="368" height="368" rx="104" fill="#C2571A"/>
  <rect x="424" y="304" width="368" height="368" rx="104" fill="#1F2430"/>
  <rect x="424" y="304" width="368" height="368" rx="104" fill="#F2C9A8" clip-path="url(#left-sheet)"/>
</svg>
