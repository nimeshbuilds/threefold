<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Threefold app icon">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF9F3"/>
      <stop offset="1" stop-color="#EFEADD"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: an 824px rounded square centred on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)"/>
  <rect x="100.500" y="100.500" width="823" height="823" rx="185.500" fill="none" stroke="#1F2430" stroke-opacity="0.08"/>
  <g transform="translate(160 160) scale(11)">
  <defs>
    <clipPath id="left-sheet"><rect x="4" y="22" width="28" height="28" rx="8"/></clipPath>
    <clipPath id="right-sheet"><rect x="32" y="22" width="28" height="28" rx="8"/></clipPath>
  </defs>
  <rect x="4" y="22" width="28" height="28" rx="8" fill="#C2571A"/>
  <rect x="32" y="22" width="28" height="28" rx="8" fill="#3B63D9"/>
  <rect x="18" y="14" width="28" height="28" rx="8" fill="#1F2430"/>
  <rect x="18" y="14" width="28" height="28" rx="8" fill="#F2C9A8" clip-path="url(#left-sheet)"/>
  <rect x="18" y="14" width="28" height="28" rx="8" fill="#C9D6F7" clip-path="url(#right-sheet)"/>
  </g>
</svg>
